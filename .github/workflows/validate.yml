name: PR validation (linux/amd64)

on:
  pull_request:
    branches: [master]

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-linux-amd64:
    name: validate-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: docker.io/library/rust:1.82-bookworm@sha256:d9c3c6f1264a547d84560e06ffd79ed7a799ce0bff0980b26cf10d29af888377
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact source and Debian environment
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(. /etc/os-release && printf '%s' "${VERSION_CODENAME}")" = "bookworm"
          test "$(dpkg --print-architecture)" = "amd64"
          rustup component add rustfmt --toolchain 1.82.0
          rustc --version
          rustfmt --version

      - name: Install native test dependencies from Debian Bookworm
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout --kill-after=30s 20m apt-get \
            -o DPkg::Lock::Timeout=120 \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          timeout --kill-after=30s 20m apt-get \
            -o DPkg::Lock::Timeout=120 \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes --no-install-recommends \
            libunwind-dev \
            libgstrtspserver-1.0-dev \
            libgstreamer1.0-dev \
            libgtk2.0-dev \
            jq \
            pkg-config \
            protobuf-compiler \
            libssl-dev

      - name: Check stable formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Check publication security and AGPL conveyance policy
        shell: bash
        run: bash .github/scripts/check-publication-policy.sh

      - name: Run exact leak regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features rtsp::factory::tests::exact_size_pool_strategy_grows_with_distinct_frame_sizes -- --exact
          cargo test --workspace --all-features rtsp::factory::tests::distinct_size_batches_release_owned_frames_and_preserve_metadata -- --exact

      - name: Test the workspace with all features
        shell: bash
        run: cargo test --workspace --all-features

      - name: Create durable publication binding
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          umask 077
          test "${GITHUB_EVENT_NAME}" = pull_request
          test "${GITHUB_REPOSITORY}" = max5800/neolink
          test "${BASE_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          test "${BASE_REPOSITORY_ID}" = "${REPOSITORY_ID}"
          test "${HEAD_REPOSITORY_ID}" = "${REPOSITORY_ID}"
          test "${BASE_REF}" = master
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${GITHUB_WORKFLOW_REF}" = "${GITHUB_REPOSITORY}/.github/workflows/validate.yml@refs/pull/${PR_NUMBER}/merge"
          source .github/scripts/resolve-publication-binding.sh
          write_binding_document publication-binding.json \
            "${GITHUB_REPOSITORY}" "${REPOSITORY_ID}" "${PR_NUMBER}" \
            "${HEAD_SHA}" "${HEAD_REF}" "${HEAD_REPOSITORY}" "${HEAD_REPOSITORY_ID}" \
            "${BASE_SHA}" "${BASE_REF}" "${BASE_REPOSITORY}" "${BASE_REPOSITORY_ID}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${GITHUB_WORKFLOW_REF}"
          verify_binding_document publication-binding.json \
            "${GITHUB_REPOSITORY}" "${REPOSITORY_ID}" "${PR_NUMBER}" \
            "${HEAD_SHA}" "${HEAD_REF}" "${HEAD_REPOSITORY}" "${HEAD_REPOSITORY_ID}" \
            "${BASE_SHA}" "${GITHUB_RUN_ID}"

      - name: Upload durable publication binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-binding-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-binding.json
          if-no-files-found: error
          retention-days: 90
